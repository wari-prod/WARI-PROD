<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WARI PROD - Jeu musical</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070711;color:#fff;font-family:Arial,sans-serif}
#game{position:relative;width:100%;height:100%;max-width:650px;margin:auto;overflow:hidden;background:linear-gradient(180deg,#15152c,#05050b
)}
#top{height:70px;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;position:relative;z-index:5}
.brand{font-size:22px;font-weight:900;letter-spacing:2px}
#score{font-size:20px;font-weight:bold}
#board{position:absolute;top:70px;left:0;right:0;bottom:105px;display:grid;grid-template-columns:repeat(4,1fr)}
.lane{position:relative;border-left:1px solid #29293d}
.lane:last-child{border-right:1px solid #29293d}
.tile{position:absolute;left:8%;width:84%;height:72px;border-radius:14px;background:#fff;box-shadow:0 0 20px
rgba(255,255,255,.9);touch-action:none}
#hitline{position:absolute;left:0;right:0;bottom:105px;height:7px;background:#fff;box-shadow:0 0 20px #fff;z-index:4}
#hint{position:absolute;bottom:73px;left:0;right:0;text-align:center;color:#aaa;font-size:12px;z-index:5}
.overlay{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center
;padding:25px;background:rgba(5,5,12,.95)}
#gameover{display:none}
button{border:0;border-radius:30px;padding:15px 35px;font-size:18px;font-weight:800;background:#fff;color:#080812}
.small{color:#aaa;line-height:1.5;margin:8px 0 22px}
</style>
</head>
<body>
<div id="game">
<div id="top">
<div class="brand">WARI PROD</div>
<div id="score">Score : 0</div>
</div>
<div id="board"></div>
<div id="hitline"></div>
<div id="hint">TOUCHE LES CASES BLANCHES</div>
<div id="start" class="overlay">
<h1>WARI PROD</h1>
<p>Jeu de rythme musical</p>
<p class="small">Place ta musique dans ce dossier sous le nom<br><b>musique.mp3</b></p>
<button id="play">JOUER</button>
</div>
<div id="gameover" class="overlay">
<h1>GAME OVER</h1>
<p>Score final : <b id="finalScore">0</b></p>
<button id="again">REJOUER</button>
</div>
<audio id="music" src="musique.mp3" preload="auto"></audio>
</div>
<script>
const board=document.getElementById("board");
const scoreEl=document.getElementById("score");
const music=document.getElementById("music");
const start=document.getElementById("start");
const gameover=document.getElementById("gameover");
const finalScore=document.getElementById("finalScore");
let score=0;
let running=false;
let tiles=[];
let raf=0;
let lastTime=0;
let lastSpawn=0;
const SPEED=360;
const SPAWN_EVERY=520;
for(let i=0;i<4;i++){
const lane=document.createElement("div");
lane.className="lane";
lane.dataset.lane=i;
board.appendChild(lane);
}
function resetGame(){
tiles.forEach(t=>t.el.remove());
tiles=[];
score=0;
scoreEl.textContent="Score : 0";
finalScore.textContent="0";
music.currentTime=0;
running=true;
start.style.display="none";
gameover.style.display="none";
lastTime=performance.now();
lastSpawn=lastTime;
music.play().catch(()=>{});
cancelAnimationFrame(raf);
raf=requestAnimationFrame(loop);
}
function spawnTile(){
const laneIndex=Math.floor(Math.random()*4);
const el=document.createElement("div");
el.className="tile";
el.style.top="-80px";
document.querySelectorAll(".lane")[laneIndex].appendChild(el);
const tile={
el:el,
lane:laneIndex,
y:-80,
hit:false
};
el.addEventListener("pointerdown",function(e){
e.preventDefault();
hitTile(tile);
});
tiles.push(tile);
}
function hitTile(tile){
if(!running || tile.hit) return;
const hitY=board.clientHeight-105;
if(tile.y > hitY-95 && tile.y < hitY+35){
tile.hit=true;
tile.el.remove();
score+=10;
scoreEl.textContent="Score : "+score;
}
}
function loop(now){
if(!running) return;
const dt=Math.min((now-lastTime)/1000,0.05);
lastTime=now;
if(now-lastSpawn>=SPAWN_EVERY){
spawnTile();
lastSpawn=now;
}
const hitY=board.clientHeight-105;
for(let i=tiles.length-1;i>=0;i--){
const tile=tiles[i];
if(tile.hit){
tiles.splice(i,1);
continue;
}
tile.y+=SPEED*dt;
tile.el.style.top=tile.y+"px";
if(tile.y>hitY+25){
endGame();
return;
}
}
raf=requestAnimationFrame(loop);
}
function endGame(){
running=false;
music.pause();
finalScore.textContent=score;
gameover.style.display="flex";
cancelAnimationFrame(raf);
}
document.getElementById("play").addEventListener("click",resetGame);
document.getElementById("again").addEventListener("click",resetGame);
</script>
</body>
  </html>
